<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Events</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
        }
        .badge {
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container mt-5">
        <h2 class="text-center mb-5 fw-semibold text-primary">Joined Events</h2>

        <div class="row g-4">
            <div class="col-md-6 col-lg-4" th:each="event : ${joinedEvents}">
                <div class="card shadow-sm border-0 rounded-4 h-100">
                    <div class="card-body d-flex flex-column">
                        <!-- Title and Badge -->
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title fw-bold mb-0" th:text="${event.name}"></h5>
                            <span class="badge"
                                  th:classappend="${event.isExpired} ? 'bg-secondary' : 'bg-success'"
                                  th:text="${event.isExpired} ? 'Expired' : 'Active'">
                            </span>
                        </div>

                        <!-- Description -->
                        <p class="small" th:text="${#strings.abbreviate(event.description, 100)}"></p>


                        <!-- Info -->
                        <p class="text-muted small mb-4">
                            📍 <span th:text="${event.location}"></span><br>
                            🗓 <span th:text="${#temporals.format(event.eventDate, 'dd MMM yyyy HH:mm')}"></span>
                        </p>

                        <!-- Leave Button -->
                        <form th:action="@{/events/leave}" method="post" 
                              th:if="${loogeduser != event.createdBy}" class="mt-auto">
                            <input type="hidden" name="eventId" th:value="${event.id}">
                            <button type="submit" class="btn btn-danger btn-sm w-100">
                                Leave Event
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- No Events Message -->
        <div class="text-center mt-5 text-muted" th:if="${#lists.isEmpty(joinedEvents)}">
            <p>You haven't joined any events yet.</p>
        </div>
    </div>

</body>
</html>
