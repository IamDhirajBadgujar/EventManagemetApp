<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Event</title>
    <script src="https://cdn.tailwindcss.com"></script>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body >
   <div th:replace="fragments/navbar :: navbar"></div>
<div class="bg-gradient-to-r from-blue-50 to-purple-100 flex items-center justify-center min-h-screen py-8">

    <div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-xl">
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Create an Event</h2>

        <form action="/events/create" method="post" th:object="${eventDTO}" class="space-y-5">

            <div>
                <label class="block text-gray-700 font-medium mb-1">Event Name</label>
                <input type="text" th:field="*{name}" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-1">Description</label>
                <textarea th:field="*{description}" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none"></textarea>
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-1">Location</label>
                <input type="text" th:field="*{location}" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-1">Event Date</label>
                <input type="datetime-local" 
               		   th:field="*{eventDate}" 
               		   required 
               		    th:attr="min=${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd''T''HH:mm')}"
           			 class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-1">Max Participants</label>
                <input type="number" min="1" th:field="*{maxParticipants}" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
            </div>

            <!-- Dropdown for Image Name -->
   <div>
    <label class="block text-gray-600">Genre (Image):</label>
    <select id="genreDropdown" name="imageName" th:field="*{imageName}"
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none" required
            onchange="updatePreview()">
        <option value="" disabled selected>Select a genre</option>
        <option value="CHARITY.jpg">Charity</option>
        <option value="TECH.jpg">Tech</option>
        <option value="GAMING.jpg">Gaming</option>
        <option value="MUSIC.jpg">Music</option>
        <option value="TRAVEL.jpg">Travel</option>
        <option value="SPORT.jpg">Sport</option>
        <option value="CONFERENCE.jpg">Conference</option>
    </select>
</div>

<!-- Image Preview -->
<div id="previewContainer" class="mt-4 hidden">
    <label class="block text-gray-600 mb-2">Preview:</label>
    <img id="genrePreview" src="" alt="Genre Preview"
         class="w-full h-48 object-cover rounded-lg shadow-md border">
</div>
<script>
    function updatePreview() {
        const selectedValue = document.getElementById('genreDropdown').value;
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('genrePreview');

        if (selectedValue) {
            previewImage.src = '/images/Event_Card_images/' + selectedValue;
            previewContainer.classList.remove('hidden');
        } else {
            previewContainer.classList.add('hidden');
        }
    }
</script>




            <!-- Dropdowns for Country, State, City -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-gray-700 font-medium mb-1">Country</label>
                    <select th:field="*{country}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                        <option value="India">India</option>
                        <option value="USA">USA</option>
                        <option value="UK">UK</option>
                    </select>
                </div>

                <div>
                    <label class="block text-gray-700 font-medium mb-1">State</label>
                    <select th:field="*{state}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                        <option value="Maharashtra">Maharashtra</option>
                    </select>
                </div>

                <div>
                    <label class="block text-gray-700 font-medium mb-1">City</label>
                    <select th:field="*{city}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                        <option value="Mumbai">Mumbai</option>
                        <option value="Los Angeles">Los Angeles</option>
                        <option value="London">London</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg shadow-md transition duration-200">
                Create Event
            </button>
        </form>
    </div>
    </div>
    <script>
    // Set min value to current local datetime in yyyy-MM-ddTHH:mm format
    window.addEventListener('DOMContentLoaded', () => {
        const eventDateInput = document.getElementById('eventDateInput');
        const now = new Date();
        now.setSeconds(0);  // optional: drop seconds for consistency
        const offset = now.getTimezoneOffset();
        const localISOTime = new Date(now.getTime() - offset * 60000)
                                .toISOString().slice(0, 16); // 'YYYY-MM-DDTHH:mm'

        eventDateInput.min = localISOTime;
    });
</script>
    
</body>
</html>
