<!-- Create Event Modal -->
<div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="eventModalLabel">Create an Event</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form action="/events/create" method="post" th:object="${eventDTO}">
                    <div class="mb-3">
                        <label class="form-label">Event Name:</label>
                        <input type="text" th:field="*{name}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description:</label>
                        <textarea th:field="*{description}" class="form-control" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Location:</label>
                        <input type="text" th:field="*{location}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Event Date:</label>
                        <input type="datetime-local" th:field="*{eventDate}" class="form-control" required>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create Event</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modify Event Modal -->
<div class="modal fade" id="editEventModal" tabindex="-1" aria-labelledby="editEventModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Modify Event</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editEventForm" action="/events/update" method="post">
                    <input type="hidden" id="editEventId" name="id">

                    <div class="mb-3">
                        <label class="form-label">Event Name:</label>
                        <input type="text" id="editEventName" name="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description:</label>
                        <textarea id="editEventDescription" name="description" class="form-control" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Location:</label>
                        <input type="text" id="editEventLocation" name="location" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Event Date:</label>
                        <input type="datetime-local" id="editEventDate" name="eventDate" class="form-control" required>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function editEventModal(eventId, eventName, eventDescription, eventLocation, eventDate) {
    document.getElementById('editEventId').value = eventId;
    document.getElementById('editEventName').value = eventName;
    document.getElementById('editEventDescription').value = eventDescription;
    document.getElementById('editEventLocation').value = eventLocation;
    document.getElementById('editEventDate').value = eventDate; // Ensure correct format for datetime-local input
    
    var editModal = new bootstrap.Modal(document.getElementById('editEventModal'));
    editModal.show();
}
</script>

<!-- FontAwesome Icons -->
