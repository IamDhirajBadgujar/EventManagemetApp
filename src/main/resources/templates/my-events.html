<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Events</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
        }
        .card {
            transition: transform 0.2s ease-in-out;
        }
        .card:hover {
            transform: scale(1.02);
        }
        .card-title {
            font-size: 1.25rem;
        }
        .modal-title {
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">
    <h2 class="text-center mb-5 fw-bold text-primary">My Events</h2>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="event : ${myCreatedEvents}">
            <div class="card shadow border-0 rounded-4 h-100">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="card-title mb-0" th:text="${event.name}"></h5>
                        <span class="badge" th:classappend="${event.isExpired} ? 'bg-secondary' : 'bg-success'" th:text="${event.isExpired} ? 'Expired' : 'Active'"></span>
                    </div>
                    <p class="card-text text-secondary mb-3" th:text="${event.description}"></p>
                    <div class="small text-muted mb-3">
                        📍 <span th:text="${event.location}"></span><br>
                        🗓 <span th:text="${#temporals.format(event.eventDate, 'dd MMM yyyy HH:mm')}"></span>
                    </div>
                    <div class="mt-auto">
                        <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-primary w-100">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- No Events Message -->
    <div class="text-center mt-5" th:if="${#lists.isEmpty(myCreatedEvents)}">
        <p class="text-muted fs-5">You haven't joined any events yet.</p>
    </div>
</div>

<!-- Create Event Modal -->
<div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow-sm">
            <div class="modal-header">
                <h5 class="modal-title" id="eventModalLabel">Create an Event</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form action="/events/create" method="post" th:object="${eventDTO}">
                    <div class="mb-3">
                        <label class="form-label">Event Name:</label>
                        <input type="text" th:field="*{name}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description:</label>
                        <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Location:</label>
                        <input type="text" th:field="*{location}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Event Date:</label>
                        <input type="datetime-local" th:field="*{eventDate}" class="form-control" required>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create Event</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modify Event Modal -->
<div class="modal fade" id="editEventModal" tabindex="-1" aria-labelledby="editEventModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow-sm">
            <div class="modal-header">
                <h5 class="modal-title">Modify Event</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editEventForm" action="/events/update" method="post">
                    <input type="hidden" id="editEventId" name="id">
                    <div class="mb-3">
                        <label class="form-label">Event Name:</label>
                        <input type="text" id="editEventName" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description:</label>
                        <textarea id="editEventDescription" name="description" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Location:</label>
                        <input type="text" id="editEventLocation" name="location" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Event Date:</label>
                        <input type="datetime-local" id="editEventDate" name="eventDate" class="form-control" required>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function editEventModal(eventId, eventName, eventDescription, eventLocation, eventDate) {
        document.getElementById('editEventId').value = eventId;
        document.getElementById('editEventName').value = eventName;
        document.getElementById('editEventDescription').value = eventDescription;
        document.getElementById('editEventLocation').value = eventLocation;
        document.getElementById('editEventDate').value = eventDate;
        var editModal = new bootstrap.Modal(document.getElementById('editEventModal'));
        editModal.show();
    }
</script>

</body>
</html>
