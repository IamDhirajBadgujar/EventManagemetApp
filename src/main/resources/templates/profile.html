<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Edit Profile</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body >

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">
  <div class="max-w-xl mx-auto bg-white dark:bg-gray-800 p-5 rounded-3xl shadow-lg">

    <h2 class="text-center text-2xl font-bold mb-4">Edit Profile</h2>

    <!-- Edit form visible only if 30 days have passed -->
    <form th:if="${canEdit}" th:action="@{/update-profile}" method="post" th:object="${user}">

      <input type="hidden" th:field="*{id}" />

      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" th:field="*{username}" class="form-control" />
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" th:field="*{email}" class="form-control" />
      </div>

      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="text" th:field="*{phone}" class="form-control" />
      </div>

      <div class="mb-3">
        <label class="form-label">Location</label>
        <input type="text" th:field="*{location}" class="form-control" />
      </div>

      <div class="mb-3">
        <label class="form-label">Date of Birth</label>
        <input type="date" th:field="*{dob}" class="form-control" />
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-success px-4">
          <i class="fas fa-save me-1"></i> Save Changes
        </button>
      </div>

    </form>

    <!-- Message shown if update not allowed -->
    <div th:if="${!canEdit}" class="alert alert-warning text-center">
      You can update your profile only once every 30 days.<br>
      Last Updated: <span th:text="${#dates.format(user.lastUpdated, 'dd MMM yyyy')}">--</span>
    </div>

    <div class="text-center mt-4">
      <a href="/dashboard" class="btn btn-secondary">
        <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
      </a>
    </div>
  </div>
</div>

</body>
</html>
