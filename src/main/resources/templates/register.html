<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header text-center">
                        <h3>Register</h3>
                    </div>
                    
                    <hr>
                     <!-- Success and Error Messages -->
    <div th:if="${success}" class="alert alert-success">Registration successful! <a th:href="@{/login}">Click here to login</a>.</div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>


                    
                    
                    <div class="card-body">
                        <form th:action="@{/register}" method="post" th:object="${userDto}">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" th:field="*{username}" required>
                            </div>
                           
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" required>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone</label>
                                <input type="text" class="form-control" id="phone" th:field="*{phone}">
                            </div>
                            <!-- Dropdown for Location -->
                            <div class="mb-3">
                                <label for="location" class="form-label">Location</label>
                                <select class="form-select" id="location" th:field="*{location}" required>
                                    <option value="" disabled selected>Select Location</option>
                                    <option value="Mumbai">Mumbai</option>
                                    <option value="Delhi">Delhi</option>
                                    <option value="Bangalore">Bangalore</option>
                                    <option value="Pune">Pune</option>
                                    <option value="Hyderabad">Hyderabad</option>
                                    <option value="Chennai">Chennai</option>
                                    <option value="Kolkata">Kolkata</option>
                                </select>
                            </div>
                            <!-- Date Picker for Date of Birth -->
                            <div class="mb-3">
                                <label for="dob" class="form-label">Date of Birth</label>
                                <input type="date" class="form-control" id="dob" th:field="*{dob}" required>
                            </div>
                           <div class="mb-3">
               					 <label class="form-label">Password</label>
             				     <input type="password" id="password" th:field="*{password}" class="form-control" required>
           				   </div>
        				    <div class="mb-3">
        				        <label class="form-label">Confirm Password</label>
          				        <input type="password" id="confirmpassword" th:field="*{confirmpassword}" class="form-control" required>
        				    </div>
                            <button type="submit" class="btn btn-primary w-100">Register</button>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <p>Already have an account? <a th:href="@{/login}">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
